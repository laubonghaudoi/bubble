metrics:
- metric_id: sofr
  legacy_ids: []
  label: SOFR
  layer: LIQUIDITY_FUEL
  phase: P0
  availability: ACTIVE_FREE
  source_ids:
  - nyfed_markets
  network_enabled: true
  is_proxy: false
  unit: percent
  frequency: business_daily
  reason: null
  proxy_disclosure: ''
  methodology:
    question: How expensive is broad Treasury repo funding?
    definition: Volume-weighted overnight Treasury repo rate published by the New York Fed.
    why_it_matters: A move relative to IORB can reveal secured-funding pressure.
    direction: Rising relative to IORB usually means tighter marginal secured funding.
    calculation: Use the official SOFR observation; spreads are calculated separately.
    frequency_and_lag: Business daily, normally published on the next business morning.
    common_misreads: A single move does not prove reserve scarcity.
    technical_distortions: Month-end, quarter-end, settlements, collateral specials, and dealer balance-sheet effects can distort it.
    confirm_with:
    - iorb
    - sofr_iorb_spread_bp
    - tgcr
    - bgcr
    cannot_infer: Cannot alone prove a liquidity crisis or predict asset prices.
    source_and_license_note: New York Fed official data; preserve required source attribution and reference-rate disclaimer where applicable.
    proxy_disclosure: ''
  implemented: true
- metric_id: iorb
  legacy_ids: []
  label: IORB
  layer: LIQUIDITY_FUEL
  phase: P0
  availability: ACTIVE_FREE
  source_ids:
  - fred_government
  source_series:
    fred_government: IORB
  network_enabled: true
  is_proxy: false
  unit: percent
  frequency: policy_event
  reason: null
  proxy_disclosure: ''
  methodology:
    question: What can eligible banks earn on reserve balances?
    definition: Interest rate paid by the Federal Reserve on reserve balances.
    why_it_matters: It is the core policy-rate comparator for overnight funding rates.
    direction: A higher IORB raises the administered-rate anchor; spread direction matters more than level alone.
    calculation: Use the official IORB percent rate effective for each observation date.
    frequency_and_lag: Policy-event frequency; the value persists until the next effective change.
    common_misreads: An unchanged IORB is not a fresh daily market observation.
    technical_distortions: FOMC implementation changes and effective-date boundaries affect as-of joins.
    confirm_with:
    - sofr
    - effr
    - obfr
    - tgcr
    - bgcr
    cannot_infer: Cannot measure reserve abundance or market stress by itself.
    source_and_license_note: Government-origin series distributed by the FRED API; requires FRED_API_KEY and is restricted to the reviewed allowlist.
    proxy_disclosure: ''
  implemented: true
- metric_id: sofr_iorb_spread_bp
  legacy_ids:
  - sofr_iorb_spread
  label: SOFR−IORB spread
  layer: LIQUIDITY_FUEL
  phase: P0
  availability: ACTIVE_FREE
  source_ids:
  - nyfed_markets
  - fred_government
  source_series:
    fred_government: IORB
  network_enabled: true
  is_proxy: false
  unit: bp
  frequency: business_daily
  reason: null
  proxy_disclosure: ''
  methodology:
    question: Is Treasury repo funding expensive relative to IORB?
    definition: SOFR minus backward-as-of IORB for the same effective observation date, in basis points.
    why_it_matters: It is the primary secured-funding pressure signal.
    direction: A sustained rise above zero is tighter; one-day spikes require confirmation.
    calculation: "(SOFR percent - IORB percent) x 100, without linear interpolation."
    frequency_and_lag: Business daily; changes use valid observations rather than calendar days.
    common_misreads: A single +3 bp print is a watch threshold, not a crisis signal.
    technical_distortions: Quarter-end, settlements, collateral specials, and operational events can lower confidence.
    confirm_with:
    - effr_iorb_spread_bp
    - tgcr_iorb_spread_bp
    - bgcr_iorb_spread_bp
    - srf_accepted
    - reserve_balances
    cannot_infer: Cannot alone prove systemic reserve scarcity or forecast market direction.
    source_and_license_note: New York Fed official data; preserve required source attribution and reference-rate disclaimer where applicable.
    proxy_disclosure: ''
  implemented: true
- metric_id: effr
  legacy_ids: []
  label: EFFR
  layer: LIQUIDITY_FUEL
  phase: P0
  availability: ACTIVE_FREE
