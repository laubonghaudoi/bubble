- metric_id: tga_daily
  legacy_ids: []
  label: Treasury General Account daily balance
  layer: LIQUIDITY_FUEL
  phase: P0
  availability: ACTIVE_FREE
  source_ids:
  - treasury_fiscaldata
  network_enabled: true
  is_proxy: false
  unit: USD bn
  frequency: business_daily
  reason: null
  proxy_disclosure: ''
  methodology:
    question: How much cash does Treasury hold at the Federal Reserve?
    definition: Daily closing balance of the Treasury General Account, normalized to USD billions.
    why_it_matters: TGA changes alter Federal Reserve liabilities and can drain or add reserve balances, all else equal.
    direction: A rise often drains bank reserves; a fall often adds them, but offsets matter.
    calculation: Normalize the FiscalData closing balance to USD billions.
    frequency_and_lag: Business daily with Treasury publication lag.
    common_misreads: A TGA rise is not automatically bearish or a one-for-one market liquidity drain.
    technical_distortions: Tax dates, debt issuance, settlements, and extraordinary measures can dominate.
    confirm_with:
    - reserve_balances
    - on_rrp_accepted
    - tga_weekly_h41
    cannot_infer: Cannot alone determine net dollar liquidity or asset prices.
    source_and_license_note: U.S. Treasury FiscalData official API; preserve dataset attribution and as-of date.
    proxy_disclosure: ''
  implemented: true
- metric_id: on_rrp_accepted
  legacy_ids:
  - on_rrp
  label: ON RRP accepted amount
  layer: LIQUIDITY_FUEL
  phase: P0
  availability: ACTIVE_FREE
  source_ids:
  - nyfed_markets
  network_enabled: true
  is_proxy: false
  unit: USD bn
  frequency: business_daily
  reason: null
  proxy_disclosure: ''
  methodology:
    question: How much eligible cash is parked at the Fed overnight?
    definition: Accepted amount across eligible ON RRP operations on the operation date.
    why_it_matters: Declines can cushion TGA growth or QT on the Fed liability side.
    direction: A decline can release a buffer, but may simply reflect better bill or repo returns.
    calculation: Aggregate accepted amounts, retain source raw values, and normalize to USD billions.
    frequency_and_lag: Business daily after operation results are released.
    common_misreads: Falling ON RRP is not automatically a risk-on liquidity injection.
    technical_distortions: Operational-readiness exercises and money-market relative-value shifts can distort interpretation.
    confirm_with:
    - tga_daily
    - reserve_balances
    - sofr_iorb_spread_bp
    cannot_infer: Cannot alone forecast equities or prove reserve scarcity.
    source_and_license_note: New York Fed official data; preserve required source attribution and reference-rate disclaimer where applicable.
    proxy_disclosure: ''
  implemented: true
- metric_id: srf_accepted
