  methodology:
    question: Are counterparties drawing the Standing Repo Facility?
    definition: Accepted amount across same-day SRF operations, with security-type breakdown and technical-exercise flag.
    why_it_matters: Nontechnical persistent use can confirm marginal Treasury financing pressure.
    direction: Persistent nontechnical use is more concerning than a technical exercise or next-day return to zero.
    calculation: Sum accepted amounts by operation date; preserve submitted, accepted, rate, and collateral breakdown.
    frequency_and_lag: Business daily after repo operation results are released.
    common_misreads: Facility rate or a small-value exercise is not genuine stress usage.
