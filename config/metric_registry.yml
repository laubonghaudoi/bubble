  proxy_disclosure: ''
  methodology:
    question: Is aggregate hyperscaler cash CapEx growth accelerating or decelerating year over year?
    definition: Percentage-point change in aggregate YoY cash CapEx growth versus the previous calendar quarter; aggregate dollars are summed before growth and acceleration are calculated.
    why_it_matters: A persistent broad deceleration is more informative than a single company's timing-driven quarter, while positive acceleration shows investment growth is still gaining pace.
    direction: Positive is ACCELERATING, negative is DECELERATING, zero is FLAT; a single negative quarter is context, not an exit signal.
    calculation: For aggregate cash CapEx, compute YoY growth as CapEx_t / CapEx_t-4 - 1, then YoY acceleration as growth_t minus growth_t-1. QoQ growth and acceleration are retained as supporting statistics.
