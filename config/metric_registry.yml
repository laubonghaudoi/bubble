- metric_id: sec_form4_nonderivative_ps_count_ratio_20d
  legacy_ids: []
  label: SEC Form 4 reported P/S count ratio · 20D proxy
  layer: MARKET_IGNITION
  phase: P2
  availability: ACTIVE_PROXY
  source_ids:
  - sec_edgar
  network_enabled: true
  is_proxy: true
  unit: ratio
  frequency: business_daily
  reason: null
  proxy_disclosure: Form 4 codes P and S include open-market or private purchases and sales; the ratio counts eligible non-derivative transaction rows, not unique insiders or trades.
  methodology:
    question: How does the count of reported non-derivative Form 4 P rows compare with S rows over the latest 20 completed EDGAR index business days?
    definition: Count eligible Table I non-derivative transaction rows coded P or S by SEC filing availability date. SEC defines P and S as open-market or private purchases and sales, so this is not open-market-only.
    why_it_matters: It gives a broad, reproducible insider-filing fragility context while preserving coverage, amendment, pricing, and 10b5 limitations.
    direction: A higher ratio means more reported P rows relative to S rows within the stated filing window; it is context and not a return forecast.
    calculation: Use (P count + 1) / (S count + 1) over 20 completed EDGAR-index business days. Publish 5D separately. Dollar ratios require at least 80% priced-row coverage; 10b5 sensitivity includes only filings explicitly marked false.
    frequency_and_lag: Business daily after the completed SEC daily master index is available. Observation uses the window end; release time uses the latest included EDGAR acceptance; pipeline update is separate.
    common_misreads: Counts are transaction rows, not unique insiders, trades, issuers, or dollar conviction. P/S can be private transactions, and a filing-level 10b5 flag is not row-level classification.
    technical_distortions: Joint-owner duplicate index rows, missing prices, amendments, late filings, 10b5 unknowns, and index revisions can affect the aggregates and coverage.
    confirm_with:
    - nonfinancial_equities_gdp_proxy
    cannot_infer: Cannot establish insider intent, distinguish all public from private transactions, or predict market direction.
    source_and_license_note: SEC EDGAR official filing data. Cite accessions and source URLs, do not use the SEC seal, and do not imply SEC affiliation or endorsement.
    proxy_disclosure: Form 4 codes P and S include open-market or private purchases and sales; the ratio counts eligible non-derivative transaction rows, not unique insiders or trades.
  implemented: true
