- metric_id: reserve_balances
  legacy_ids: []
  label: Reserve balances with Federal Reserve Banks
  layer: LIQUIDITY_FUEL
  phase: P0
  availability: ACTIVE_FREE
  source_ids:
  - fred_government
  source_series:
    fred_government: WRESBAL
  network_enabled: true
  is_proxy: false
  unit: USD bn
  frequency: weekly
  reason: null
  proxy_disclosure: ''
  methodology:
    question: How many reserve balances are held at Federal Reserve Banks?
    definition: H.4.1 reserve balances with Federal Reserve Banks, normalized to USD billions.
    why_it_matters: The level and four-week change provide balance-sheet context for funding spreads.
    direction: A persistent decline can tighten the buffer, but reserve demand changes over time.
    calculation: Use official weekly level; calculate 1w and 4w changes from observations.
    frequency_and_lag: Weekly, normally Thursday around 4:30 p.m. ET; retain last value as NOT_RELEASED_YET before release.
    common_misreads: Reference zones are context, not fixed crisis thresholds.
    technical_distortions: Bank-system size, regulation, payment flows, and statement-date effects change reserve demand.
    confirm_with:
    - sofr_iorb_spread_bp
    - tga_daily
    - on_rrp_accepted
    - srf_accepted
    cannot_infer: Cannot identify an invariant minimum reserve level.
    source_and_license_note: Government-origin series distributed by the FRED API; requires FRED_API_KEY and is restricted to the reviewed allowlist.
    proxy_disclosure: ''
  implemented: true
