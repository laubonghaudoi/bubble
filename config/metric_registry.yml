- metric_id: nonfinancial_equities_gdp_proxy
  legacy_ids: []
  label: Nonfinancial corporate equities / GDP proxy
  layer: MARKET_IGNITION
  phase: P2
  availability: ACTIVE_PROXY
  source_ids:
  - fred_government
  source_series:
    fred_government:
    - NCBEILQ027S
    - GDP
  network_enabled: true
  is_proxy: true
  unit: percent
  frequency: quarterly
  reason: null
  proxy_disclosure: Nonfinancial corporate equity liabilities are not total U.S. equity market capitalization.
  methodology:
    question: How large are U.S. nonfinancial corporate equity liabilities relative to nominal GDP?
    definition: Federal Reserve Z.1 nonfinancial corporate equity liabilities divided by BEA nominal GDP for the exact same quarter.
    why_it_matters: It supplies a broad valuation and balance-sheet fragility context without relying on a proprietary public-equity index.
    direction: A higher ratio means equity liabilities are larger relative to current annualized economic output; it is context, not a timing signal.
    calculation: Join NCBEILQ027S and GDP by exact calendar quarter with no forward fill; convert equities from USD millions to billions, then calculate equities_bn / GDP_bn × 100. QoQ and YoY are changes in the ratio; the 10-year percentile uses up to 40 exact common quarters.
    frequency_and_lag: Quarterly. Z.1 and GDP release on different schedules and revise history, so the latest common quarter and both component observation dates are shown separately.
    common_misreads: 'This is not the Buffett indicator: the numerator includes listed and closely held or private nonfinancial corporate equity liabilities, while GDP is an annualized flow.'
    technical_distortions: Z.1 benchmark revisions, GDP revisions, and the stock-versus-annualized-flow denominator can materially change history.
    confirm_with:
    - sec_form4_nonderivative_ps_count_ratio_20d
    cannot_infer: Cannot prove a bubble, identify a peak, or predict the direction or timing of equity returns.
    source_and_license_note: Government-origin NCBEILQ027S and GDP are restricted to the reviewed FRED allowlist; the supported API requires FRED_API_KEY and both source agencies must be attributed.
    proxy_disclosure: Nonfinancial corporate equity liabilities are not total U.S. equity market capitalization.
  implemented: true
