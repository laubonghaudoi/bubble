  reason: null
  proxy_disclosure: ''
  methodology:
    question: What is the effective unsecured federal-funds rate?
    definition: Volume-weighted median rate on overnight federal-funds transactions reported to the New York Fed.
    why_it_matters: It confirms whether unsecured interbank funding is moving relative to IORB.
    direction: A rise relative to IORB can confirm broader funding pressure.
    calculation: Use the official EFFR observation.
    frequency_and_lag: Business daily, normally published on the next business morning.
    common_misreads: EFFR level alone mainly reflects the policy corridor.
    technical_distortions: Reporting composition and policy effective dates affect comparisons.
    confirm_with:
    - iorb
    - effr_iorb_spread_bp
    - sofr
    cannot_infer: Cannot alone show repo-market or system-wide stress.
    source_and_license_note: New York Fed official data; preserve required source attribution and reference-rate disclaimer where applicable.
    proxy_disclosure: ''
  implemented: true
