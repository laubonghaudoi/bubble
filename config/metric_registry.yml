  network_enabled: true
  is_proxy: true
  unit: percent_open_interest
  frequency: weekly
  reason: null
  proxy_disclosure: CFTC business categories do not measure every CTA or actual model exposure.
  contract_code: 13874A
  contract_name: E-MINI S&P 500
  trader_category: leveraged_funds
  methodology:
    question: How is the CFTC leveraged-funds category positioned in E-mini S&P 500 futures?
    definition: Leveraged Funds long minus short futures-only positions divided by total open interest for CFTC contract 13874A.
