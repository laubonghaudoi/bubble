name: Update data and deploy Pages
on:
  schedule:
    - cron: '15 22 * * 1-5'
    - cron: '45 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt}
      - run: pip install -r pipeline/requirements.txt
      - name: Update official data
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python -m pipeline.update --mode incremental 2>&1 | tee pipeline-update.log
      - run: python -m pytest pipeline/tests
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit changed generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data
          git diff --cached --quiet || git commit -m 'chore(data): refresh liquidity snapshot'
          git push || true
      - uses: actions/upload-artifact@v4
        with: {name: pipeline-health, path: pipeline-update.log, retention-days: 14}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
